# The Storybook image, composed into storybook.jakoblui.com (storybook-host's `refs`). Only
# /assets/ has content hashes in its file names, so only it is cached for a year; the rest (index.json,
# the HTML, Storybook's own sb-* bundles) revalidates, so a deploy or an upgrade shows at once.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location / {
        # storybook-host reads index.json from here. The origin is named, not `*`, so credentialed
        # requests work too: Storybook sends credentials for a ref it couldn't check while building,
        # and browsers reject `*` with credentials. One location, so all headers apply (a nested
        # location's add_header would replace them).
        add_header Access-Control-Allow-Origin "https://storybook.jakoblui.com" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin" always;
        add_header Cache-Control $cache_control;
        try_files $uri $uri/ =404;
    }
}
